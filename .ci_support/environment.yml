name: phase-diagram-workflows-test
channels:
  - conda-forge
  - defaults
dependencies:
  # Python and build tools
  - python
  - pip
  - hatchling

  # Core dependencies
  - ase
  - calphy
  - lammps
  - pandas
  - lammpsparser
  - ruamel.yaml
  - pydantic>=2,<3
  - matplotlib
  - iprpy-data

  # Potential data, for the real-LAMMPS integration tests in
  # tests/test_convex_hull.py (lammpsparser.get_potential_by_name).
  # Not on PyPI, conda-forge only.
  - iprpy-data

  # Development dependencies
  - pytest
  - pytest-cov
  - black
  - ruff
  - mypy

  # Executor dependencies
  - executorlib>=1.0.0
  - pylammpsmpi>=0.1.0
