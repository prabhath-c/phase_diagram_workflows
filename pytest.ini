[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = --verbose --color=yes
# Local worst-case single test was ~17s; even at a generous 7x CI slowdown
# margin that's ~120s, so a hang (which ran past 20+ minutes with zero
# progress) fails loudly and fast here instead of costing another full,
# blind CI run.
timeout = 120
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests (deselect with '-m "not integration"')
    unit: marks unit tests