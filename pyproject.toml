[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phase_diagrams_workflows"
version = "0.1.0"
description = "Workflows to run calphy free energy calculations with executorlib."
authors = [
    { name = "Prabhath Chilakalapudi", email = "prabhath.chilakalapudi@mpi-susmat.de" },
]

readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
keywords = ["free energy", "thermodynamic integration", "phase diagrams"]
dependencies = [
    "ase",
    "calphy",
    "pandas",
    "lammpsparser",
    "ruamel.yaml",
    "pydantic>=2,<3",
    "scipy"
]

[project.optional-dependencies]
executor = ["executorlib>=1.0.0", "pylammpsmpi>=0.1.0"]
# atomistics[lammps] (not bare atomistics) so pip's resolver actually sees
# atomistics' own pylammpsmpi/lammpsparser upper bounds -- without it,
# pip has no reason to keep those below whatever atomistics.calculators.lammps
# was actually tested against, and can silently pick versions with breaking
# API changes atomistics' own import-warning wrapper then swallows (surfacing
# as `atomistics.calculators` having no `lammps` attribute at import time,
# not as an install-time conflict).
atomistics = ["atomistics[lammps]"]
materials_project = ["mp-api", "pymatgen"]
plotting = ["plotly", "seaborn", "matplotlib"]
# The test suite mocks mp-api/atomistics/executorlib at their call boundary
# rather than skipping them, so these need to be importable (never actually
# called for real) wherever tests run -- hence dev pulling in the other
# extras rather than just lint/test tooling.
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "phase_diagrams_workflows[atomistics,materials_project,plotting]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phase_diagram_workflows"]
